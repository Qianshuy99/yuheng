name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 产物入库（@downloadURL 指向它），所以最容易出的错是改了 src/ 忘了 build。
      # 这里重新构建，用 git 判断有没有差异——有就说明库里的 dist/ 是旧的。
      - name: Rebuild and verify dist/ is in sync
        run: |
          npm run build
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ 与 src/ 不一致：请在本地跑 npm run build 并提交 dist/。"
            git --no-pager diff --stat -- dist/
            exit 1
          fi

      - name: Verify release metadata and official themes
        run: npm run verify:release

      - name: Self-check in headless Chrome
        run: npm run check
