<!doctype html>
<!--
  Dubhe Core 自检页。不是给人看的，由 scripts/selfcheck.mjs 用无头 Chrome 打开、
  读取 <pre id="result"> 的内容判定通过与否。

  这里刻意用最小的 Flarum DOM（只要有 #app 和 header 就够），因为要测的是引擎行为
  ——挂载 / 卸载 / 残留 / host 选择 / 导入校验——不是视觉效果。
-->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Dubhe Core 自检</title>
</head>
<body>
<div id="app" class="App">
	<div id="drawer" class="App-drawer">
		<header id="header" class="App-header"><div class="container">
			<div class="Header-title"><a href="#">自检站</a></div>
			<div id="header-secondary" class="Header-secondary"><ul class="Header-controls">
				<!-- 带上真正的 SessionDropdown + .Dropdown-menu：线上「点头像没反应」是 header
				     的 overflow:hidden 把绝对定位的菜单裁掉了，最小 DOM 里没有菜单就测不出这条。 -->
				<li class="item-session SessionDropdown Dropdown open">
					<button class="Dropdown-toggle Button Button--user"><span class="Button-label">Qianshuy99</span></button>
					<ul class="Dropdown-menu Dropdown-menu--right">
						<li><a href="#">设置</a></li>
						<li><button type="button">退出登录</button></li>
					</ul>
				</li>
			</ul></div>
		</div></header>
	</div>
	<main class="App-content"><div id="content">
		<nav id="portal-source" class="IndexPage-nav sideNav"><ul><li><a href="#inbox">收件箱</a></li></ul></nav>
		<!-- 撑高文档，好让下面的「滚到底不露壁纸」有东西可滚 -->
		<div style="height:2400px"></div>
	</div></main>
	<!-- 回复框：Flarum 把它钉在 bottom:0（这里没加载 forum.css，手动补上这条定位），
	     主题要把它整体抬到任务栏之上 -->
	<div class="App-composer" style="position:fixed;left:0;right:0;bottom:0"><div class="Composer"><div class="Composer-footer">
		<button class="Button Button--primary">发布回复</button>
	</div></div></div>
</div>
<pre id="result">（未运行）</pre>
<script src="./gm-mock.js"></script>
<script>
// 自检不要开机动画挡事
(function () {
	const config = GM_getValue('yh:config', null) || {};
	const themeSettings = config.themeSettings || {};
	themeSettings['xp.luna'] = { ...(themeSettings['xp.luna'] || {}), boot: false };
	GM_setValue('yh:config', { ...config, themeSettings });
})();
</script>
<script src="./skin.js"></script>
<script>
addEventListener('load', () => setTimeout(runChecks, 400));

const lines = [];
function check(name, pass, detail) {
	lines.push(`${pass ? 'PASS' : 'FAIL'}  ${name}${pass || !detail ? '' : `  → ${detail}`}`);
}

function styleIds() {
	return ['yh-theme-style', 'yh-theme-vars', 'yh-theme-layout', 'yh-shell-style'].filter((id) => document.getElementById(id));
}

function xpClasses() {
	return [...document.documentElement.classList].filter((c) => c.startsWith('xp-') || c.startsWith('yh-'));
}

function xpNodes() {
	return document.querySelectorAll('.xp-chrome,.xp-taskbar,.xp-desktop,.xp-startmenu,.xp-boot').length;
}

function panelButton(text) {
	return [...document.querySelectorAll('#yh-shell .yh-btn')].find((b) => b.textContent.includes(text));
}

function themeRow(text) {
	return [...document.querySelectorAll('#yh-shell .yh-theme')].find((r) => r.textContent.includes(text));
}

/** 关掉所有对话框，避免上一段留下的遮罩让后面的 querySelector 拿错元素。 */
function closeDialogs() {
	for (const mask of document.querySelectorAll('#yh-shell .yh-dlg-mask')) {
		mask.querySelector('.yh-panel-close')?.click();
		mask.remove();
	}
}

async function runChecks() {
	const root = document.documentElement;

	/* --- 1. 首次挂载 --- */
	check('主题样式已注入', Boolean(document.getElementById('yh-theme-style')));
	check('vars 块已注入（--xp-bliss）',
		(document.getElementById('yh-theme-vars')?.textContent || '').includes('--xp-bliss'));
	check('root 打上 yh-on + 主题 class',
		root.classList.contains('yh-on') && root.classList.contains('yh-theme-xp-luna'),
		xpClasses().join(' '));
	check('data-yh-theme = xp.luna', root.getAttribute('data-yh-theme') === 'xp.luna');
	check('声明式布局样式已注入', Boolean(document.getElementById('yh-theme-layout')));
	check('布局根与区域已标记',
		document.querySelector('#app[data-yh-layout-root="xp.luna"]')
			&& document.querySelector('#drawer[data-yh-layout-region="header"]')
			&& document.querySelector('.App-content[data-yh-layout-region="content"]'));
	check('AICue 语义区域已标记',
		document.querySelector('#app[data-yh-aicue="flarum"][data-yh-aicue-page="index"]')
			&& document.querySelector('#drawer[data-yh-aicue-region="drawer"]')
			&& document.querySelector('.App-content[data-yh-aicue-region="content"]')
			&& document.querySelector('#content[data-yh-aicue-region="page"]')
			&& document.querySelector('.App-composer[data-yh-aicue-region="composer"]'),
		`app=${document.querySelector('#app')?.getAttribute('data-yh-aicue')} drawer=${document.querySelector('#drawer')?.getAttribute('data-yh-aicue-region')} content=${document.querySelector('.App-content')?.getAttribute('data-yh-aicue-region')} page=${document.querySelector('#content')?.getAttribute('data-yh-aicue-region')} composer=${document.querySelector('.App-composer')?.getAttribute('data-yh-aicue-region')}`);
	const appContent = document.querySelector('.App-content');
	appContent?.classList.add('DiscussionPage');
	await Promise.resolve();
	await Promise.resolve();
	check('AICue 适配器跟随 SPA 页面类型切换',
		document.querySelector('#app[data-yh-aicue-page="discussion"]'));
	appContent?.classList.remove('DiscussionPage');
	await Promise.resolve();
	await Promise.resolve();
	check('主题 DOM 已建（chrome/taskbar/desktop）', xpNodes() >= 3, `找到 ${xpNodes()} 个`);
	check('外壳样式与主题样式分开', Boolean(document.getElementById('yh-shell-style')));
	check('--header-height 被主题接管',
		getComputedStyle(root).getPropertyValue('--header-height').trim() !== '',
		'空值');
	const headerHeightOn = getComputedStyle(root).getPropertyValue('--header-height').trim();
	const bodyPadOn = getComputedStyle(document.body).paddingBottom;

	/* --- 1b. 布局回归：线上暴露的三个 bug 都能在离线抓到 --- */
	// bug 3：header 容器不能裁掉绝对定位的用户菜单，否则点头像「像是没反应」
	const headerContainer = document.querySelector('.App-header .container');
	check('header 容器不裁切下拉菜单（overflow 非 hidden）',
		headerContainer && getComputedStyle(headerContainer).overflowX !== 'hidden',
		headerContainer ? getComputedStyle(headerContainer).overflow : '(无 .container)');
	const menu = document.querySelector('.App-header .SessionDropdown .Dropdown-menu');
	const menuVisible = menu && getComputedStyle(menu).display !== 'none'
		&& menu.getBoundingClientRect().height > 0;
	check('打开的用户菜单可见（.open 下有高度）', Boolean(menuVisible),
		menu ? `display=${getComputedStyle(menu).display} h=${Math.round(menu.getBoundingClientRect().height)}` : '(无菜单)');
	// bug 1：回复框整体（含最底一行按钮）要落在任务栏上边缘之上
	const taskbarH = parseFloat(getComputedStyle(root).getPropertyValue('--xp-taskbar-h')) || 0;
	const composer = document.querySelector('.App-composer');
	const composerBottom = composer ? composer.getBoundingClientRect().bottom : null;
	check('任务栏高度变量存在', taskbarH > 0, String(taskbarH));
	check('回复框底部不被任务栏遮住',
		composerBottom !== null && composerBottom <= window.innerHeight - taskbarH + 1,
		`composer.bottom=${Math.round(composerBottom)} 视口-任务栏=${window.innerHeight - taskbarH}`);
	// bug 2：滚到文档末尾时不能露出壁纸。窗口白底与蓝边框是 body::after / html::after
	// 两层 fixed，位置与文档高度无关，所以滚动前后量出来应当完全一样。
	// （截图测不了这条：无头 Chrome 把 fixed 元素画在 scrollY + top 上。）
	const fillBefore = getComputedStyle(document.body, '::after').bottom;
	const frameBefore = getComputedStyle(root, '::after').bottom;
	scrollTo(0, document.body.scrollHeight);
	check('文档确实滚动了（否则下一条断言没意义）', window.scrollY > 100, `scrollY=${window.scrollY}`);
	check('窗口白底是 fixed 的，滚动后位置不变',
		getComputedStyle(document.body, '::after').bottom === fillBefore
		&& getComputedStyle(document.body, '::after').position === 'fixed',
		`${fillBefore} → ${getComputedStyle(document.body, '::after').bottom}`);
	check('窗口边框是 fixed 的，滚动后位置不变',
		getComputedStyle(root, '::after').bottom === frameBefore
		&& getComputedStyle(root, '::after').position === 'fixed',
		`${frameBefore} → ${getComputedStyle(root, '::after').bottom}`);
	// 白底的下边缘正好压在任务栏上沿：留缝就是壁纸，盖过去就挡住任务栏
	check('窗口白底下边缘贴着任务栏上沿',
		parseFloat(fillBefore) === taskbarH, `bottom=${fillBefore} 任务栏=${taskbarH}px`);
	scrollTo(0, 0);

	/* --- 2. 关掉主题：不能有残留 --- */
	document.querySelector('#yh-shell .yh-ball')?.click();
	// bug 4：点球开面板时，球「变成」面板 —— 球应被藏起来（yh-morphed），面板打开
	const ballAfterOpen = document.querySelector('#yh-shell .yh-ball');
	check('面板打开后悬浮球隐藏（morph）',
		ballAfterOpen?.classList.contains('yh-morphed') === true,
		[...(ballAfterOpen?.classList || [])].join(' '));
	check('面板处于打开态',
		document.querySelector('#yh-shell .yh-panel')?.classList.contains('yh-open') === true);
	// bug 4：面板要浅色。取面板底色的亮度，浅色底 sRGB 三通道都应偏高
	const panelBg = getComputedStyle(document.querySelector('#yh-shell .yh-panel')).backgroundColor;
	const rgb = (panelBg.match(/\d+/g) || []).map(Number);
	const lightPanel = rgb.length >= 3 && (rgb[0] + rgb[1] + rgb[2]) / 3 > 200;
	check('面板是浅色主题', lightPanel, panelBg);
	const off = themeRow('不使用主题');
	check('面板里有「不使用主题」行', Boolean(off));
	off?.click();

	check('主题 <style> 已移除', !document.getElementById('yh-theme-style'));
	check('vars <style> 已移除', !document.getElementById('yh-theme-vars'));
	check('布局 <style> 已移除', !document.getElementById('yh-theme-layout'));
	check('外壳 <style> 仍在（不该被带走）', Boolean(document.getElementById('yh-shell-style')));
	check('root class 已清空', xpClasses().filter((c) => c !== 'yh-on').length === 0, xpClasses().join(' '));
	check('data-yh-theme 已移除', !root.hasAttribute('data-yh-theme'));
	check('布局标记已清理',
		!document.querySelector('[data-yh-layout-root],[data-yh-layout-region]'));
	check('AICue 语义标记已清理', !document.querySelector('[data-yh-aicue],[data-yh-aicue-region],[data-yh-aicue-page]'));
	check('主题 DOM 已清空', xpNodes() === 0, `残留 ${xpNodes()} 个`);
	check('--header-height 已还原',
		getComputedStyle(root).getPropertyValue('--header-height').trim() !== headerHeightOn);
	check('body padding-bottom 已还原',
		getComputedStyle(document.body).paddingBottom !== bodyPadOn,
		`仍是 ${bodyPadOn}`);
	check('本站选择写入 activeByHost',
		(GM_getValue('yh:config', {}).activeByHost || {})[location.hostname] === '',
		JSON.stringify(GM_getValue('yh:config', {}).activeByHost));

	/* --- 3. 再切回来：mount 幂等 --- */
	const back = themeRow('Windows XP');
	back?.click();
	check('可以重新挂载', Boolean(document.getElementById('yh-theme-style')) && xpNodes() >= 3,
		`style=${Boolean(document.getElementById('yh-theme-style'))} nodes=${xpNodes()}`);
	check('重挂后没有重复 chrome', document.querySelectorAll('.xp-chrome').length === 1,
		`${document.querySelectorAll('.xp-chrome').length} 个`);
	check('重挂后 activeByHost = xp.luna',
		(GM_getValue('yh:config', {}).activeByHost || {})[location.hostname] === 'xp.luna');

	/* --- 4. 校验器边界（通过导入对话框走一遍真实路径） --- */
	panelButton('导入主题')?.click();
	const textarea = document.querySelector('#yh-shell .yh-dlg textarea');
	const importBtn = [...document.querySelectorAll('#yh-shell .yh-dlg-foot .yh-btn')]
		.find((b) => b.textContent.includes('校验并导入'));
	check('导入对话框已打开', Boolean(textarea && importBtn));

	const tryImport = (json) => {
		if (!textarea || !importBtn) return '(无对话框)';
		textarea.value = json;
		importBtn.click();
		const err = document.querySelector('#yh-shell .yh-dlg-err');
		return err ? err.textContent : '';
	};

	const base = { id: 't.x', name: '测试', version: '1.0.0', author: 'a', match: ['*://*.example.com/*'] };
	check('拒绝携带 JavaScript 的包',
		tryImport(JSON.stringify({ ...base, css: 'body{color:red}', mount: 'x' })).includes('JavaScript'));
	check('拒绝 @import',
		tryImport(JSON.stringify({ ...base, css: '@import url(//evil.test/a.css);' })).includes('@import'));
	check('拒绝 expression()',
		tryImport(JSON.stringify({ ...base, css: 'body{width:expression(alert(1))}' })).length > 0);
	check('拒绝超过 512KB 的 CSS',
		tryImport(JSON.stringify({ ...base, css: 'a{}'.repeat(200000) })).length > 0);
	check('拒绝没有 id 的包',
		tryImport(JSON.stringify({ name: '无 id', css: 'body{}' })).length > 0);

	// 合法包应当通过校验，走到确认页（第二个对话框里有「导入」按钮）
	const okErr = tryImport(JSON.stringify({
		...base,
		css: '/* ok */ body{background:#fff}.x{background:url(https://cdn.example.org/a.png)}',
	}));
	const confirmBtn = [...document.querySelectorAll('#yh-shell .yh-dlg-foot .yh-btn')]
		.find((b) => b.textContent.trim() === '导入');
	check('合法包通过校验并进入确认页', okErr === '' && Boolean(confirmBtn), okErr || '没有确认按钮');
	const noteText = [...document.querySelectorAll('#yh-shell .yh-dlg-note')].map((n) => n.textContent).join(' ');
	check('确认页列出站外域名', noteText.includes('cdn.example.org'), noteText.slice(0, 80));
	closeDialogs();

	/* --- 5. 导出 → 再导入：内置主题序列化后必须还能过自己的校验器 --- */
	panelButton('导出当前主题')?.click();
	const exported = document.querySelector('#yh-shell .yh-dlg textarea')?.value || '';
	check('导出对话框给出 JSON', exported.length > 1000, `长度 ${exported.length}`);
	closeDialogs();

	let pack = null;
	try {
		pack = JSON.parse(exported);
	} catch (err) {
		/* 下面的断言会报出来 */
	}
	check('导出包不含任何 JS 字段',
		Boolean(pack) && ['mount', 'unmount', 'script', 'js', 'code'].every((k) => pack[k] === undefined));
	check('导出包内联了壁纸 data URI',
		Boolean(pack) && String(pack.vars?.['--xp-bliss'] || '').includes('data:image'),
		String(pack?.vars?.['--xp-bliss'] || '').slice(0, 40));

	panelButton('导入主题')?.click();
	const ta2 = document.querySelector('#yh-shell .yh-dlg textarea');
	const btn2 = [...document.querySelectorAll('#yh-shell .yh-dlg-foot .yh-btn')]
		.find((b) => b.textContent.includes('校验并导入'));
	// 原样回灌：校验器管不了重名（它不认识注册表），该由 app 层拒绝并且不写存储
	ta2.value = JSON.stringify(pack);
	btn2.click();
	[...document.querySelectorAll('#yh-shell .yh-dlg-foot .yh-btn')]
		.find((b) => b.textContent.trim() === '导入')?.click();
	check('与内置主题重名的包不会写进存储',
		!(GM_getValue('yh:themes', []) || []).some((p) => p.id === 'xp.luna'),
		JSON.stringify((GM_getValue('yh:themes', []) || []).map((p) => p.id)));
	check('内置主题没被顶掉',
		(document.querySelector('#yh-shell .yh-theme .yh-theme-name')?.textContent || '') === 'Windows XP');
	closeDialogs();

	panelButton('导入主题')?.click();
	const ta3 = document.querySelector('#yh-shell .yh-dlg textarea');
	const btn3 = [...document.querySelectorAll('#yh-shell .yh-dlg-foot .yh-btn')]
		.find((b) => b.textContent.includes('校验并导入'));
	ta3.value = JSON.stringify({ ...pack, id: 'xp.copy', name: 'XP 副本' });
	btn3.click();
	const err3 = document.querySelector('#yh-shell .yh-dlg-err');
	check('改了 id 的导出包能通过校验', !err3, err3 ? err3.textContent.slice(0, 120) : '');
	[...document.querySelectorAll('#yh-shell .yh-dlg-foot .yh-btn')]
		.find((b) => b.textContent.trim() === '导入')?.click();
	check('导入后写进了 yh:themes',
		(GM_getValue('yh:themes', []) || []).some((p) => p.id === 'xp.copy'),
		JSON.stringify((GM_getValue('yh:themes', []) || []).map((p) => p.id)));
	closeDialogs();

	// 面板从第 2 段起就一直开着；只有它被关掉时才需要再点球（点开着的球会把它关掉）
	if (!document.querySelector('#yh-shell .yh-panel')?.classList.contains('yh-open')) {
		document.querySelector('#yh-shell .yh-ball')?.click();
	}
	check('面板里出现了导入的主题', Boolean(themeRow('XP 副本')));
	const copyRow = themeRow('XP 副本');
	check('导入主题带删除按钮', Boolean(copyRow?.querySelector('.yh-theme-del')));

	// 切到副本：纯 CSS 包（没有 mount）也要能挂上，且不残留 XP 的 DOM
	copyRow?.click();
	check('可以切到纯 CSS 导入包',
		document.documentElement.getAttribute('data-yh-theme') === 'xp.copy'
		&& Boolean(document.getElementById('yh-theme-style')),
		document.documentElement.getAttribute('data-yh-theme') || '(无)');
	check('切到纯 CSS 包后 XP 的 DOM 已清掉', xpNodes() === 0, `残留 ${xpNodes()} 个`);
	check('纯 CSS 包不带 mount，root class 只有引擎的',
		document.documentElement.classList.contains('yh-theme-xp-copy'),
		xpClasses().join(' '));

	// 删除导入包：应当回落到内置 XP
	copyRow?.querySelector('.yh-theme-del')?.click();
	[...document.querySelectorAll('#yh-shell .yh-dlg-foot .yh-btn')]
		.find((b) => b.textContent.trim() === '删除')?.click();
	check('删除后 yh:themes 里没有残留',
		!(GM_getValue('yh:themes', []) || []).some((p) => p.id === 'xp.copy'));
	check('删除后回落到内置主题',
		document.documentElement.getAttribute('data-yh-theme') === 'xp.luna',
		document.documentElement.getAttribute('data-yh-theme') || '(无)');
	closeDialogs();

	/* --- 6. 声明式门户：保留会被 SPA 路由替换的原生导航节点 --- */
	panelButton('导入主题')?.click();
	const portalTextarea = document.querySelector('#yh-shell .yh-dlg textarea');
	const portalValidate = [...document.querySelectorAll('#yh-shell .yh-dlg-foot .yh-btn')]
		.find((b) => b.textContent.includes('校验并导入'));
	const portalSource = document.querySelector('#portal-source');
	portalTextarea.value = JSON.stringify({
		...base,
		id: 'portal.copy',
		name: 'Portal test',
		css: 'body{--portal-test:1}',
		layout: { portals: [{ id: 'primary-nav', source: '#content .IndexPage-nav.sideNav', minWidth: 320 }] },
	});
	portalValidate?.click();
	[...document.querySelectorAll('#yh-shell .yh-dlg-foot .yh-btn')]
		.find((b) => b.textContent.trim() === '导入')?.click();
	await new Promise((resolve) => setTimeout(resolve, 0));
	const portalHost = document.querySelector('[data-yh-layout-portal="portal.copy:primary-nav"]');
	check('声明式门户迁移原生导航节点', Boolean(portalHost?.contains(portalSource)));
	// Simulate Flarum replacing the route subtree after a discussion click.
	document.querySelector('#content').innerHTML = '<div class="DiscussionPage"><nav class="DiscussionPage-nav">scrubber</nav></div>';
	await new Promise((resolve) => setTimeout(resolve, 0));
	check('SPA 替换内容区后门户导航保持不变', Boolean(portalHost?.isConnected && portalHost.contains(portalSource)));
	themeRow('Windows XP')?.click();
	await new Promise((resolve) => setTimeout(resolve, 0));
	check('卸载门户主题后不残留门户节点', !document.querySelector('[data-yh-layout-portal]'));
	const portalRow = themeRow('Portal test');
	portalRow?.querySelector('.yh-theme-del')?.click();
	[...document.querySelectorAll('#yh-shell .yh-dlg-foot .yh-btn')]
		.find((b) => b.textContent.trim() === '删除')?.click();
	closeDialogs();

	document.getElementById('result').textContent = lines.join('\n');
}
</script>
</body>
</html>
